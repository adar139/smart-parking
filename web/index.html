
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parking Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 24px 40px;
        }

        header h1 {
            margin: 0;
        }

        main {
            padding: 35px 40px;
        }

        .stats {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            max-width: 250px;
        }

        .stats h2 {
            margin: 0;
            font-size: 36px;
        }

        .cars {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .car {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            padding-bottom: 20px;
        }

        .car img {
            width: 100%;
            height: 170px;
            object-fit: cover;
        }

        .car h3, .car p {
            margin: 12px 18px;
        }

        .status {
            color: #16a34a;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>Smart Parking</h1>
        <p>License Plate Tracking System</p>
    </header>

    <main>

        <section class="stats">
            <p>Currently Parked Vehicles</p>
            <h2>3</h2>
        </section>

        <h2>Recent Entries</h2>

        <section class="cars">

            <div class="car">
                <img src="http://localhost:8081/images/car1.jpg" alt="Vehicle 1">
                <h3>Vehicle 1</h3>
                <p>License: 123-45-678</p>
                <p>Entry: 08:30</p>
                <p class="status">Inside Parking</p>
            </div>

            <div class="car">
                <img src="http://localhost:8081/images/car2.jpg" alt="Vehicle 2">
                <h3>Vehicle 2</h3>
                <p>License: 987-65-432</p>
                <p>Entry: 09:15</p>
                <p class="status">Inside Parking</p>
            </div>

            <div class="car">
                <img src="http://localhost:8081/images/car3.jpg" alt="Vehicle 3">
                <h3>Vehicle 3</h3>
                <p>License: 456-78-912</p>
                <p>Entry: 10:05</p>
                <p class="status">Inside Parking</p>
            </div>

        </section>

    </main>

</body>
</html>
